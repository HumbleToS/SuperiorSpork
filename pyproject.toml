[tool.ruff]
target-version = "py311"
line-length = 125

[tool.ruff.lint]
select = [
    "ANN",
    "ASYNC",
    "B",
    "C4",
    "E",
    "F",
    "G",
    "I",
    "N",
    "PERF",
    "PTH",
    "RUF",
    "SIM",
    "TC",
    "UP",
    "W",
]
ignore = [
    "E501",
    "ANN401",
    "G004",
    "N818",
    "PERF203",
    "RUF001",
    "RUF009",
    "SIM105",
    "SIM117",
    "UP034",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"exts/utils/time.py" = ["N801"]
"exts/utils/wording.py" = ["N801"]

[tool.ruff.lint.isort]
split-on-trailing-comma = true
combine-as-imports = true

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
